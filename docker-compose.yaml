services:
  postgres:
    image: postgres:15-alpine
    container_name: storage-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: storage-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio
    container_name: storage-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY}
    ports:
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data

  createbuckets:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set local http://minio:9000 ${AWS_ACCESS_KEY_ID} ${AWS_SECRET_ACCESS_KEY}); do
        echo 'Ожидание запуска MinIO...';
        sleep 1;
      done;
      /usr/bin/mc mb --ignore-existing local/${AWS_STORAGE_BUCKET_NAME};
      exit 0;
      "

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - web
    restart: unless-stopped

  web:
    build: .
    command: gunicorn core.wsgi:application --bind 0.0.0.0:8000 --workers 3
    expose:
      - "8000"
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
      - createbuckets

volumes:
    redis_data:
    postgres_data:
    minio_data:
    createbuckets_data:
